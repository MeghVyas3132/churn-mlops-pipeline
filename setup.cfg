[flake8]
# 100 columns, because 79 forces awkward wrapping on sklearn's long call
# signatures without making anything more readable.
max-line-length = 100
max-complexity = 12
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    mlruns,
    .dvc
per-file-ignores =
    # Module-level imports must follow matplotlib.use("Agg"); E402 is expected.
    src/models/evaluate.py:E402
