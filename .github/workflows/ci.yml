name: CI

# Requirement: tests run automatically on every push AND every pull request.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Lets the workflow be triggered by hand from the Actions tab, which is handy
  # for demonstrating it during assessment.
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local development interpreter and the pins in requirements.txt.
  PYTHON_VERSION: "3.14"

jobs:

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install flake8
        run: python -m pip install --upgrade pip flake8==7.3.0

      - name: Fail on syntax errors and undefined names
        # These are real breakage, never style opinions.
        run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Full style check
        run: flake8 src tests --count --statistics

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with coverage
        # The suite builds its own synthetic fixtures, so it passes on a bare
        # clone with no DVC credentials and no data pulled. A suite that skipped
        # itself when data was absent would give a green tick proving nothing.
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  pipeline-check:
    name: Validate DVC pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install DVC
        run: python -m pip install --upgrade pip "dvc==3.67.1"

      - name: Check dvc.yaml parses and the DAG resolves
        # Catches a malformed stage, a typo in a dependency path or an
        # accidental cycle before anyone wastes time on a full repro.
        run: dvc dag

      - name: Confirm dvc.lock is committed
        # Without dvc.lock in Git nobody can reproduce the exact data version,
        # which breaks the reproducibility requirement outright.
        run: |
          if [ ! -f dvc.lock ]; then
            echo "::error::dvc.lock is missing. Run 'dvc repro' and commit it."
            exit 1
          fi
          echo "dvc.lock present."
